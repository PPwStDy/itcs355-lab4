name: CD
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
  id-token: write
concurrency:
  group: staging-deployment
  cancel-in-progress: false
jobs:
  deploy-staging:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    environment: staging
    env:
      TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
      ACR_NAME: ${{ vars.ACR_NAME }}
      CONTAINER_REGISTRY: ${{ vars.CONTAINER_REGISTRY }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZUREML_WORKSPACE: ${{ vars.AZUREML_WORKSPACE }}
      STAGING_ENDPOINT: ${{ vars.STAGING_ENDPOINT || 'itcs355-staging' }}
      STAGING_INSTANCE: ${{ vars.STAGING_INSTANCE || 'Standard_DS3_v2' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install PyYAML==6.0.2
      - uses: actions/download-artifact@v4
        with:
          name: serving-${{ github.event.workflow_run.head_sha }}
          path: reports
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Push the tested image
        run: |
          : "${ACR_NAME:?Set ACR_NAME}" "${CONTAINER_REGISTRY:?Set CONTAINER_REGISTRY}"
          az acr login --name "$ACR_NAME"
          docker load -i reports/serving-image.tar
          docker tag "itcs355-serve:$TESTED_SHA" "$CONTAINER_REGISTRY:$TESTED_SHA"
          docker push "$CONTAINER_REGISTRY:$TESTED_SHA"
      - name: Deploy registered model in the tested container and smoke test staging
        run: |
          az extension add --name ml --upgrade --yes
          python scripts/deploy_staging.py
