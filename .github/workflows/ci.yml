name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Lint
        run: ruff check src/ service/ monitoring/ scripts/ tests/
      - name: Portability audit
        run: python scripts/portability_audit.py
      - name: Generate dataset
        run: python scripts/make_dataset.py
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: training-reference
          path: data/raw/sensors.csv
          retention-days: 90
      - name: Unit tests
        run: pytest -q tests/test_data.py -k 'split or fingerprint'
      - name: Data contract tests
        run: pytest -q tests/test_data.py -k 'not split and not fingerprint'
      - name: Model behaviour tests
        run: pytest -q tests/test_model_behaviour.py
      - name: Service and monitoring tests
        run: pytest -q tests/test_service.py tests/test_monitoring.py
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - uses: docker/setup-buildx-action@v3
      - name: Export model with the serving dependency versions
        run: |
          python scripts/make_dataset.py
          python scripts/export_model.py --out reports/model.joblib
      - name: Build training image
        run: docker buildx build --platform linux/amd64 -t itcs355:${{ github.sha }} --load .
      - name: Build serving image
        run: docker buildx build --platform linux/amd64 -f service/Dockerfile.serve -t itcs355-serve:${{ github.sha }} --load .
      - name: Integration test
        env:
          EXPECTED_VERSION: ${{ github.sha }}
        run: |
          trap 'docker logs svc; docker stop svc' EXIT
          docker run -d --rm --name svc -p 8080:8080 \
            -v "$PWD/reports:/app/reports:ro" \
            -e MODEL_PATH=/app/reports/model.joblib \
            -e MODEL_VERSION="$EXPECTED_VERSION" \
            itcs355-serve:"$EXPECTED_VERSION"
          python scripts/check_container.py
      - name: Save tested image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker save itcs355-serve:${{ github.sha }} -o reports/serving-image.tar
          cp data/raw/sensors.csv reports/reference.csv
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: serving-${{ github.sha }}
          path: |
            reports/serving-image.tar
            reports/model.joblib
            reports/reference.csv
          retention-days: 7
