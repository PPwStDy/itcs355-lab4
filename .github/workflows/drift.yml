name: Scheduled drift
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  detect:
    runs-on: ubuntu-latest
    env:
      DRIFT_WINDOW_URL: ${{ vars.DRIFT_WINDOW_URL }}
      MONITORING_TOKEN: ${{ secrets.MONITORING_TOKEN }}
      DRIFT_ALERT_WEBHOOK_URL: ${{ secrets.DRIFT_ALERT_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Load immutable training reference
        uses: actions/download-artifact@v4
        with:
          name: training-reference
          path: data/raw
          github-token: ${{ github.token }}
          run-id: ${{ vars.DRIFT_REFERENCE_RUN_ID }}
      - name: Compare the actual production window and notify
        run: |
          set +e
          python scripts/scheduled_drift.py
          result=$?
          if [ "$result" -eq 2 ]; then
            echo 'Drift detected and alert delivered'
            exit 0
          fi
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drift-${{ github.run_id }}
          path: reports/scheduled-drift.json
          if-no-files-found: warn
